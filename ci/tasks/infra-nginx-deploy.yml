platform: linux

image_resource:
  type: registry-image
  source:
    repository: alpine
    tag: "3.21"

params:
  SSH_HOST: ""
  SSH_USER: ""
  SSH_PRIVATE_KEY: ""
  DEPLOY_DIR: /opt/infra-nginx

inputs:
  - name: infra-ci

run:
  path: sh
  args:
    - -ec
    - |
      set -o pipefail
      apk add --no-cache openssh-client docker-cli curl jq

      resolve_host_via_doh() {
        host="$1"
        if printf '%s' "$host" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
          printf '%s\n' "$host"
          return 0
        fi

        curl -fsSL \
          --resolve dns.google:443:8.8.8.8 \
          --resolve dns.google:443:8.8.4.4 \
          "https://dns.google/resolve?name=${host}&type=A" \
          | jq -r '.Answer[]? | select(.type == 1) | .data' \
          | head -n 1
      }

      RESOLVED_SSH_HOST="$(resolve_host_via_doh "$SSH_HOST")"
      if [ -z "$RESOLVED_SSH_HOST" ]; then
        echo "ERROR: Could not resolve SSH host via DoH: $SSH_HOST" >&2
        exit 1
      fi

      SSH_KEY_FILE="$(mktemp)"
      cleanup() {
        rm -f "$SSH_KEY_FILE"
      }
      trap cleanup EXIT

      printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
      chmod 600 "$SSH_KEY_FILE"
      SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i ${SSH_KEY_FILE}"
      SSH_TARGET="${SSH_USER}@${RESOLVED_SSH_HOST}"
      TEMPLATE_DIR="infra-ci/ci/templates"

      ssh ${SSH_OPTS} "${SSH_TARGET}" "mkdir -p ${DEPLOY_DIR}"

      scp ${SSH_OPTS} "${TEMPLATE_DIR}/infra-nginx.conf" "${SSH_TARGET}:${DEPLOY_DIR}/nginx.conf"

      sed \
        -e "s|__DEPLOY_DIR__|${DEPLOY_DIR}|g" \
        "${TEMPLATE_DIR}/infra-docker-compose.nginx.yml" \
        | ssh ${SSH_OPTS} "${SSH_TARGET}" "cat > ${DEPLOY_DIR}/docker-compose.nginx.yml"

      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker volume inspect infra-certbot-certs >/dev/null 2>&1 || docker volume create infra-certbot-certs >/dev/null"
      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker volume inspect infra-certbot-www >/dev/null 2>&1 || docker volume create infra-certbot-www >/dev/null"

      # Ensure nginx can always start: bootstrap a short-lived self-signed cert if none exists yet.
      if ssh ${SSH_OPTS} "${SSH_TARGET}" "docker run --rm -v infra-certbot-certs:/etc/letsencrypt alpine:3.21 sh -ec 'test -f /etc/letsencrypt/live/infra-edge/fullchain.pem && test -f /etc/letsencrypt/live/infra-edge/privkey.pem && test -f /etc/letsencrypt/live/infra-edge/chain.pem'"; then
        echo "Certificate files already exist in infra-certbot-certs volume"
      else
        echo "No certificate found. Creating temporary self-signed certificate for nginx bootstrap."
        ssh ${SSH_OPTS} "${SSH_TARGET}" "docker run --rm -v infra-certbot-certs:/etc/letsencrypt alpine:3.21 sh -ec '
          apk add --no-cache openssl >/dev/null
          mkdir -p /etc/letsencrypt/live/infra-edge
          openssl req -x509 -nodes -days 7 -newkey rsa:2048 \
            -keyout /etc/letsencrypt/live/infra-edge/privkey.pem \
            -out /etc/letsencrypt/live/infra-edge/fullchain.pem \
            -subj "/CN=concourse.dtsoft.cloud" \
            -addext "subjectAltName=DNS:concourse.dtsoft.cloud,DNS:auth.dtsoft.cloud,DNS:auth.silora.chat,DNS:vault.dtsoft.cloud,DNS:monitor.dtsoft.cloud,DNS:kibana.dtsoft.cloud"
          cp /etc/letsencrypt/live/infra-edge/fullchain.pem /etc/letsencrypt/live/infra-edge/chain.pem
        '"
      fi

      # External networks are referenced by compose as external=true and must exist first.
      for net in vault_vault iam-keycloak-net grafana-net; do
        ssh ${SSH_OPTS} "${SSH_TARGET}" "docker network inspect '${net}' >/dev/null 2>&1 || docker network create '${net}' >/dev/null"
      done

      # During migration from old APM infra layout, apm-nginx may still bind :80/:443.
      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker rm -f apm-nginx >/dev/null 2>&1 || true"

      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker rm -f infra-nginx >/dev/null 2>&1 || true"
      ssh ${SSH_OPTS} "${SSH_TARGET}" "cd ${DEPLOY_DIR} && docker compose -p infra-nginx -f docker-compose.nginx.yml up -d --force-recreate"

      ssh ${SSH_OPTS} "${SSH_TARGET}" '
        set -e
        for i in $(seq 1 30); do
          state="$(docker inspect -f "{{.State.Status}}" infra-nginx 2>/dev/null || true)"
          if [ "$state" = "running" ]; then
            echo "infra-nginx is running"
            exit 0
          fi
          sleep 2
        done

        echo "ERROR: infra-nginx did not reach running state"
        docker ps -a --filter name=infra-nginx || true
        docker logs --tail 200 infra-nginx || true
        exit 1
      '

      for net in vault_vault iam-keycloak-net grafana-net; do
        ssh ${SSH_OPTS} "${SSH_TARGET}" "docker network connect '${net}' infra-nginx 2>/dev/null || true"
      done

      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker exec infra-nginx nginx -t"
      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker exec infra-nginx nginx -s reload"
      ssh ${SSH_OPTS} "${SSH_TARGET}" "curl -sf http://localhost/health"

      echo "=== Infra nginx deploy complete ==="
