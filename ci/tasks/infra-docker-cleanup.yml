platform: linux

image_resource:
  type: registry-image
  source:
    repository: alpine
    tag: "3.21"

params:
  SSH_HOST: ""
  SSH_USER: ""
  SSH_PRIVATE_KEY: ""

run:
  path: sh
  args:
    - -ec
    - |
      set -o pipefail
      apk add --no-cache openssh-client curl jq

      require_param() {
        local name="$1"
        local value="$2"

        if [ -z "$value" ]; then
          echo "ERROR: required param ${name} is empty" >&2
          exit 1
        fi
      }

      require_param SSH_HOST "$SSH_HOST"
      require_param SSH_USER "$SSH_USER"
      require_param SSH_PRIVATE_KEY "$SSH_PRIVATE_KEY"

      resolve_host_via_doh() {
        host="$1"
        if printf '%s' "$host" | grep -Eq '^[0-9]+(\.[0-9]+){3}$'; then
          printf '%s\n' "$host"
          return 0
        fi

        curl -fsSL \
          --resolve dns.google:443:8.8.8.8 \
          --resolve dns.google:443:8.8.4.4 \
          "https://dns.google/resolve?name=${host}&type=A" \
          | jq -r '.Answer[]? | select(.type == 1) | .data' \
          | head -n 1
      }

      RESOLVED_SSH_HOST="$(resolve_host_via_doh "$SSH_HOST")"
      if [ -z "$RESOLVED_SSH_HOST" ]; then
        echo "ERROR: Could not resolve SSH host via DoH: $SSH_HOST" >&2
        exit 1
      fi

      SSH_KEY_FILE="$(mktemp)"
      cleanup() {
        rm -f "$SSH_KEY_FILE"
      }
      trap cleanup EXIT

      printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
      chmod 600 "$SSH_KEY_FILE"

      SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i ${SSH_KEY_FILE}"
      SSH_TARGET="${SSH_USER}@${RESOLVED_SSH_HOST}"

      echo "=== Docker disk usage BEFORE cleanup ==="
      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker system df"

      echo "=== Removing stopped containers ==="
      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker container prune -f"

      echo "=== Removing unused images (not referenced by any container) ==="
      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker image prune -af"

      echo "=== Removing unused networks ==="
      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker network prune -f"

      echo "=== Docker disk usage AFTER cleanup ==="
      ssh ${SSH_OPTS} "${SSH_TARGET}" "docker system df"

      echo "=== Disk usage AFTER cleanup ==="
      ssh ${SSH_OPTS} "${SSH_TARGET}" "df -h /dev/md1 2>/dev/null || df -h /"

      echo "=== Docker cleanup DONE ==="
